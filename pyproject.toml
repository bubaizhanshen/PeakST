[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peakst"
version = "0.1.3"
description = "Peak-sensitive transfer of particle number size distributions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Rongkai Cao"},
  {name = "Xiuxiu Lin"},
  {name = "Minghan Wang"},
  {name = "Xun Zhang"},
  {name = "Na Yao"},
  {name = "Xiansheng Liu"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tabm = ["tabm>=0.0.3", "rtdl-num-embeddings>=0.0.11"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
